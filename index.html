<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;600;700&display=swap" rel="stylesheet">
<!-- Google Cast receiver framework (lets the TV run this page as a receiver app) -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root{
    --bg:#050507; --fg:#f5f6fa; --dim:#8a8e9c; --band:rgba(255,255,255,.05);
    --glass:rgba(255,255,255,.16); --cols:6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"Outfit","Segoe UI",system-ui,sans-serif; font-weight:300;
    -webkit-user-select:none; user-select:none;
  }
  #glow{position:fixed; inset:0; z-index:0; opacity:.55; filter:blur(130px); transition:background .5s ease;
        background:radial-gradient(42vw 42vw at 72% 20%, #27406b, transparent 70%),
                   radial-gradient(46vw 46vw at 22% 85%, #432a63, transparent 70%);}
  #stage{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; padding:5.5vh 5vw;}

  /* top bar */
  .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4vh;}
  .clock{font-size:7vw; font-weight:200; line-height:.9; letter-spacing:-.02em;}
  .date{font-size:1.5vw; color:var(--dim); margin-top:.8vh;}
  .right{text-align:right}
  .focusname{font-size:2.6vw; font-weight:500; min-height:3vw; transition:opacity .2s;}
  .net{font-size:1.3vw; color:var(--dim); margin-top:.6vh; display:flex; gap:.6vw; align-items:center; justify-content:flex-end;}
  .net svg{width:1.4vw; height:1.4vw; opacity:.7}

  /* app grid */
  .grid{display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:2.2vw 1.8vw;
        align-content:start; flex:1; overflow:hidden; padding:1vh .5vw;}
  .tile{position:relative; aspect-ratio:16/10; border-radius:1.4vw; display:flex;
         flex-direction:column; align-items:center; justify-content:center;
         font-weight:600; color:#fff; overflow:hidden; cursor:pointer;
         transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s;
         box-shadow:0 1.2vh 2.6vh rgba(0,0,0,.45);}
  .tile .wm{font-size:1.7vw; font-weight:700; letter-spacing:.01em; text-align:center; padding:0 .5vw; line-height:1.05;}
  .tile .sub{font-size:.95vw; font-weight:400; opacity:.85; margin-top:.3vh; letter-spacing:.12em; text-transform:uppercase;}
  .tile svg{width:2.6vw; height:2.6vw; margin-bottom:.4vh}
  .tile .label{position:absolute; bottom:-3vh; left:0; right:0; text-align:center; font-size:1vw;
               color:var(--dim); opacity:0; transition:opacity .2s;}
  .tile.focus{transform:scale(1.11); box-shadow:0 2vh 5vh rgba(0,0,0,.6), 0 0 0 .28vw var(--glass);}
  .tile.focus::after{content:""; position:absolute; inset:0; border-radius:inherit;
                     box-shadow:0 0 7vh 1.5vh rgba(150,180,255,.22); pointer-events:none;}
  .tile.focus .label{opacity:1}
  .hint{text-align:center; color:var(--dim); font-size:1vw; margin-top:1.5vh; letter-spacing:.04em;}
</style>
</head>
<body>
<div id="glow"></div>
<div id="stage">
  <div class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="right">
      <div class="focusname" id="focusname">Welcome</div>
      <div class="net"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg><span id="net">Gavins room</span></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Navigate with the TV Remote app &middot; press OK to open</div>
</div>

<script>
/* ---- app list. `wm` is a plain-text label (not a brand logo). `glyph` is a generic icon. ---- */
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const MON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';
const ANT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 10v11M8 21h8M5 9a9 9 0 0 1 14 0M8 11a5 5 0 0 1 8 0"/></svg>';
const HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg>';

const APPS = [
  {id:"netflix",  wm:"Netflix",    bg:"linear-gradient(145deg,#2a0708,#b1060f)"},
  {id:"youtube",  wm:"YouTube",    bg:"linear-gradient(145deg,#2a0000,#c40000)", glyph:PLAY},
  {id:"prime",    wm:"Prime Video",bg:"linear-gradient(145deg,#0a2742,#1399d6)"},
  {id:"disney",   wm:"Disney+",    bg:"linear-gradient(145deg,#06122e,#1a3c8f)"},
  {id:"max",      wm:"Max",        bg:"linear-gradient(145deg,#1a0f3a,#4b2ea8)"},
  {id:"hulu",     wm:"Hulu",       bg:"linear-gradient(145deg,#063d22,#1ce783)"},
  {id:"appletv",  wm:"Apple TV",   bg:"linear-gradient(145deg,#1a1a1a,#3a3a3a)"},
  {id:"spotify",  wm:"Spotify",    bg:"linear-gradient(145deg,#0a3d24,#1DB954)"},
  {id:"paramount",wm:"Paramount+", bg:"linear-gradient(145deg,#06163a,#0064ff)"},
  {id:"peacock",  wm:"Peacock",    bg:"linear-gradient(145deg,#141414,#333)"},
  {id:"pluto",    wm:"Pluto TV",   bg:"linear-gradient(145deg,#0b0f3a,#2b2f77)"},
  {id:"tubi",     wm:"Tubi",       bg:"linear-gradient(145deg,#2a0a52,#7c17d6)"},
  {id:"hdmi1",    wm:"HDMI 1",     bg:"linear-gradient(145deg,#15171c,#2b2f3a)", glyph:MON, sub:"input"},
  {id:"hdmi2",    wm:"HDMI 2",     bg:"linear-gradient(145deg,#15171c,#2b2f3a)", glyph:MON, sub:"input"},
  {id:"hdmi3",    wm:"HDMI 3",     bg:"linear-gradient(145deg,#15171c,#2b2f3a)", glyph:MON, sub:"input"},
  {id:"livetv",   wm:"Live TV",    bg:"linear-gradient(145deg,#042f2e,#0e7490)", glyph:ANT, sub:"antenna"},
  {id:"smartcast",wm:"SmartCast",  bg:"linear-gradient(145deg,#2a0708,#7a1620)", glyph:HOME, sub:"home"},
];

const COLS = 6;
document.documentElement.style.setProperty("--cols", COLS);
const grid = document.getElementById("grid");
const glow = document.getElementById("glow");
const focusName = document.getElementById("focusname");
let focusIdx = 0;

APPS.forEach((a,i)=>{
  const t = document.createElement("div");
  t.className = "tile";
  t.style.background = a.bg;
  t.dataset.id = a.id;
  t.innerHTML = (a.glyph||"") +
    '<div class="wm">'+a.wm+'</div>' +
    (a.sub ? '<div class="sub">'+a.sub+'</div>' : '') +
    '<div class="label">'+a.wm+'</div>';
  t.addEventListener("click", ()=>{ setFocus(i); select(); });
  grid.appendChild(t);
});
const tiles = [...grid.children];

const HUE = {netflix:"#b1060f",youtube:"#c40000",prime:"#1399d6",disney:"#1a3c8f",max:"#4b2ea8",
  hulu:"#1ce783",appletv:"#555",spotify:"#1DB954",paramount:"#0064ff",peacock:"#444",
  pluto:"#2b2f77",tubi:"#7c17d6",livetv:"#0e7490",smartcast:"#7a1620"};

function setFocus(i){
  if(i<0||i>=tiles.length) return;
  tiles[focusIdx].classList.remove("focus");
  focusIdx = i;
  tiles[i].classList.add("focus");
  const a = APPS[i];
  focusName.textContent = a.wm;
  glow.style.background =
    "radial-gradient(45vw 45vw at 72% 20%, "+(HUE[a.id]||"#27406b")+"88, transparent 70%),"+
    "radial-gradient(46vw 46vw at 22% 85%, #432a63, transparent 70%)";
  tiles[i].scrollIntoView({block:"nearest"});
  send({type:"focused", id:a.id, name:a.wm});
}
function move(dir){
  const last = tiles.length-1;
  let i = focusIdx;
  if(dir==="right") i = Math.min(focusIdx+1, last);
  if(dir==="left")  i = Math.max(focusIdx-1, 0);
  if(dir==="down")  i = Math.min(focusIdx+COLS, last);
  if(dir==="up")    i = Math.max(focusIdx-COLS, 0);
  setFocus(i);
}
function select(){
  tiles[focusIdx].animate(
    [{transform:"scale(1.11)"},{transform:"scale(1.02)"},{transform:"scale(1.11)"}],
    {duration:180});
  const a = APPS[focusIdx];
  // The receiver can't launch native apps itself — tell the controller to do it.
  send({type:"launch", id:a.id, name:a.wm});
}

/* ---- clock / greeting ---- */
function pad(n){return String(n).padStart(2,"0");}
function tick(){
  const d=new Date(); let h=d.getHours(); const m=pad(d.getMinutes());
  const ap=h>=12?"PM":"AM", h12=(h%12)||12;
  document.getElementById("clock").textContent=h12+":"+m+" "+ap;
  document.getElementById("date").textContent=
    d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
}
tick(); setInterval(tick,10000);

/* ---- Cast messaging: the controller app drives navigation over this channel ---- */
const NS = "urn:x-cast:com.gavinroom.launcher";
let castCtx=null;
function send(obj){ try{ if(castCtx) castCtx.sendCustomMessage(NS, undefined, obj); }catch(e){} }
try{
  castCtx = cast.framework.CastReceiverContext.getInstance();
  castCtx.addCustomMessageListener(NS, e=>{
    const m = e.data||{};
    if(m.type==="nav" && m.dir) move(m.dir);
    else if(m.type==="select") select();
    else if(m.type==="focus" && m.id){ const i=APPS.findIndex(a=>a.id===m.id); if(i>=0) setFocus(i); }
    else if(m.type==="net" && m.name) document.getElementById("net").textContent=m.name;
  });
  const opts = new cast.framework.CastReceiverOptions();
  opts.disableIdleTimeout = true;
  opts.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
  castCtx.start(opts);
  castCtx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, ()=>send({type:"ready"}));
}catch(err){ console.log("Cast SDK not active (preview mode):", err); }

/* ---- keyboard control for previewing in a normal browser ---- */
addEventListener("keydown", e=>{
  const k={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];
  if(k){ move(k); e.preventDefault(); }
  else if(e.key==="Enter"){ select(); e.preventDefault(); }
});

setFocus(0);
</script>
</body>
</html>
