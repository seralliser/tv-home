<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<!-- Google Cast receiver framework (required for the TV to accept this as a receiver app) -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --bg:#000; --fg:#f4f4f7; --dim:#8b8e99; --band:rgba(255,255,255,.06); --glass:rgba(255,255,255,.14); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"Outfit","Segoe UI",system-ui,sans-serif; font-weight:300;
    -webkit-user-select:none; user-select:none;
  }
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;700&display=swap');
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:6vh 6vw; }

  /* top bar */
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .clock { font-size:9vw; font-weight:200; line-height:.95; letter-spacing:-.02em; }
  .date  { font-size:1.8vw; color:var(--dim); margin-top:1vh; font-weight:300; }
  .greet { font-size:2.4vw; font-weight:300; text-align:right; }
  .net   { font-size:1.4vw; color:var(--dim); text-align:right; margin-top:1vh; }

  /* ambient glow behind everything */
  #glow { position:fixed; inset:0; z-index:-1; opacity:.5; filter:blur(120px);
          background:radial-gradient(40vw 40vw at 70% 25%, #2a4d7a, transparent 70%),
                     radial-gradient(45vw 45vw at 25% 80%, #5a2a6b, transparent 70%); }

  /* dock */
  .dock { display:flex; gap:2.2vw; justify-content:center; align-items:flex-end;
          background:var(--band); border-radius:2.4vw; padding:2.4vh 3vw; backdrop-filter:blur(8px); }
  .tile { width:9vw; height:9vw; border-radius:1.8vw; display:flex; align-items:center; justify-content:center;
          font-size:3.4vw; font-weight:500; position:relative; transition:transform .25s ease;
          background:linear-gradient(145deg,#1b1d24,#121318); box-shadow:0 1vh 3vh rgba(0,0,0,.5); }
  .tile .label { position:absolute; bottom:-3.2vh; left:0; right:0; text-align:center;
                 font-size:1.2vw; color:var(--dim); opacity:0; transition:opacity .2s; }
  .tile.focus { transform:scale(1.12); }
  .tile.focus .label { opacity:1; }
  .tile.focus::after { content:""; position:absolute; inset:-0.5vw; border-radius:2.2vw;
                       background:var(--glass); z-index:-1; box-shadow:0 0 6vh 1vh rgba(120,160,255,.25); }
  .n { color:#e50914; } .y { color:#ff0000; } .p { color:#1ce783; }
  .d { color:#00a8e1; } .h { color:#1ce783; } .t { color:#5a2a6b; }
  .hint { text-align:center; color:var(--dim); font-size:1.1vw; margin-top:2.5vh; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="stage">
  <div class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div>
      <div class="greet" id="greet">Welcome</div>
      <div class="net" id="net">Gavins room</div>
    </div>
  </div>

  <div>
    <div class="dock" id="dock"></div>
    <div class="hint">Use the TV Remote app to open an app or switch inputs</div>
  </div>
</div>

<script>
  // --- clock + greeting ---
  function pad(n){ return String(n).padStart(2,"0"); }
  function tick(){
    const d = new Date();
    let h = d.getHours(); const m = pad(d.getMinutes());
    const ampm = h >= 12 ? "PM" : "AM"; const h12 = (h % 12) || 12;
    document.getElementById("clock").textContent = h12 + ":" + m + " " + ampm;
    document.getElementById("date").textContent =
      d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
    document.getElementById("greet").textContent =
      h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }
  tick(); setInterval(tick, 10000);

  // --- dock tiles (visual home; launching is done from the phone/PC remote) ---
  const apps = [
    {t:"N", c:"n", label:"Netflix"},
    {t:"▶", c:"y", label:"YouTube"},
    {t:"P", c:"p", label:"Prime"},
    {t:"D", c:"d", label:"Disney+"},
    {t:"H", c:"h", label:"Hulu"},
    {t:"■", c:"t", label:"Inputs"},
  ];
  const dock = document.getElementById("dock");
  apps.forEach((a,i)=>{
    const el = document.createElement("div");
    el.className = "tile" + (i===0 ? " focus":"");
    el.innerHTML = '<span class="'+a.c+'">'+a.t+'</span><span class="label">'+a.label+'</span>';
    dock.appendChild(el);
  });

  // --- Cast receiver: keep the session alive and accept simple messages ---
  // Our phone/PC remote can later send {focus:i} or {greet:"..."} over this channel.
  try {
    const ctx = cast.framework.CastReceiverContext.getInstance();
    const NS = "urn:x-cast:com.gavinroom.launcher";
    ctx.addCustomMessageListener(NS, function(e){
      const msg = e.data || {};
      if (typeof msg.focus === "number"){
        document.querySelectorAll(".tile").forEach((t,i)=>t.classList.toggle("focus", i===msg.focus));
      }
      if (msg.greet) document.getElementById("greet").textContent = msg.greet;
    });
    const opts = new cast.framework.CastReceiverOptions();
    opts.disableIdleTimeout = true;          // don't auto-close our home screen
    opts.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
    ctx.start(opts);
  } catch (err) {
    // SDK not loaded (e.g. opened in a normal browser) — the UI still renders.
    console.log("Cast receiver SDK not active:", err);
  }
</script>
</body>
</html>
